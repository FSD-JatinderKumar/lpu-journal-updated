<app-topslider></app-topslider>
<app-journalmenubar></app-journalmenubar>
<app-journal-inner-menu></app-journal-inner-menu>
<section>
<div class="vh-150 d-flex p-2 align-items-center justify-content-center">
  <div class="container ">
    <div class="row">

      <div class="col-md-12 grid-margin stretch-card">
        <!-- <div class="card accordionColor "> -->
        <div class="card-body m-5 ">
          <h1 class="text-center themeClr"> My All ManuScript Requests </h1>
        </div>
        <!-- </div> -->
      </div>
    </div>
  </div>
</div>
<div class="vh-150 d-flex p-2 align-items-center justify-content-center p-5">

  <div class="container  table-bordered table-responsive ">
    <div class="row">
      <div class="col-md-12 stretch-card">
        <div class=" accordionColor ">
          <div class=" accordionColor " *ngIf="this.booksData?.length>0; else NoData">
            <!-- <h6 class="card-title themeClr text-center"> JournalMeuscript Requests </h6> -->
            <div class="table-responsive ">
              <div id="wrapper1">
                <div id="div1">
                </div>
              </div>
              <div id="wrapper2">
                <div id="div2 ">
                  <table id="dataTableExampleNews" class="table table-responsive accordionColor table-full-width">
                    <thead>
                      <tr>
                        <th *ngFor="let dt of displayedColumnsHeader">{{dt}}</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let row of booksData">
                        <td *ngFor="let col of displayedColumns">
                          <ng-container *ngIf="col == 'fileUrl'; else dataCell">
                            <button class="btn btn-dark" (click)="onSelectFileX(row[col])"> View File </button>
                        
                          </ng-container>
                          <ng-template #dataCell>
                            {{ row[col] }}
                          </ng-template>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <ng-template #NoData>
            <div class="col-md-12 grid-margin stretch-card themeClr">
              <h1 class="fs-2 text-center  card-body vh-150 p-3 m-4 "> No Data Found </h1>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
