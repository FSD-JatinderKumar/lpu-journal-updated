<app-topslider></app-topslider>
<app-journalmenubar></app-journalmenubar>
<app-journal-inner-menu></app-journal-inner-menu>
<section>
<div class="vh-150 d-flex p-2 align-items-center justify-content-center">
  <div class="container ">
    <div class="row">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card-body mt-5 mb-4 ">
          <h1 class="text-center themeClr"> ManuScript Requests  </h1>
        </div>
        <!-- </div> -->
      </div>
    </div>
  </div>
</div>
<div class="vh-150 d-flex p-2 align-items-center justify-content-center p-5 tableHeight">
  <div class="container-fluid table-bordered table-responsive ">
    <div class="row accordionColor " *ngIf="this.EditorData?.length>0; else NoData">
      <div class="table-responsive">
        <table class="table table-bordered  table-hover">
          <thead>
            <tr>
              <th *ngFor="let col of EditordisplayedColumns">{{ displayedEditorColumnHeaders[col] }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of paginatedEditorData">
              <td *ngFor="let col of EditordisplayedColumns">
                <ng-container [ngSwitch]="col">
                  <!-- File URL Case -->
                  <button *ngSwitchCase="'fileUrl'" class="btn btn-dark" (click)="onSelectFileEditorX(row[col])">
                    View File
                  </button>


                  <!-- Default Case -->
                  <span *ngSwitchDefault>{{ row[col] }}</span>
                </ng-container>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="pagination-controls">
          <button (click)="previousPageEditor()" [disabled]="currentPageEditor === 1">Previous</button>
          <span> Page {{ currentPageEditor }} of {{ totalPagesEditor }} </span>
          <button (click)="nextPageEditor()" [disabled]="currentPageEditor === totalPagesEditor">Next</button>
        </div>
      </div>
    </div>
    <ng-template #NoData>
      <div class="themeClr">
        <h1 class="fs-2 text-center vh-50 p-3 m-4 "> No Data Found </h1>
      </div>
    </ng-template>
  </div>
</div>
<ng-template #NoData>
  <div class="col-md-12 grid-margin stretch-card themeClr">
    <h1 class="fs-2 text-center  card-body vh-150 p-3 m-4 "> No Data Found </h1>
  </div>
</ng-template>

</section>
