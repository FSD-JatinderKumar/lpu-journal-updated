<app-topslider></app-topslider>
<app-journalmenubar></app-journalmenubar>
<app-EDEditorHeader></app-EDEditorHeader>

<div class="vh-150 d-flex p-2 align-items-center justify-content-center">
  <div class="container-fluid ">
    <div class="row">
      <div class="col-md-12 grid-margin stretch-card">
        <div class="card-body m-5 ">
          <h1 class="text-center themeClr"> Manuscript Details</h1>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="d-flex p-2 align-items-center justify-content-center tableHeight">
  <div class="container-fluid ">
    <div class="row">
      <div class="col-md-12" *ngIf="EditorData.length > 0; else NoData">
        <div class="table-responsive ">
          <table class="table table-bordered table-striped table-hover">
            <thead>
              <tr>
                <th *ngFor="let col of displayedEditorColumns">{{ displayedEditorColumnHeaders[col] }}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of paginatedEditorData">
                <td *ngFor="let col of displayedEditorColumns">
                  <ng-container [ngSwitch]="col">
                    <button *ngSwitchCase="'fileUrl'" class="btn btn-dark" (click)="onSelectFileEditorX(row[col])">
                      <!-- View File -->
                      <i class="bi bi-file-earmark-text"></i>
                    </button>
                    <button *ngSwitchCase="'journalId'" class="btn btn-primary" (click)="onTakeAction(row)"
                      data-bs-toggle="modal" data-bs-target="#assignReviewerModal">
                      <!-- Assign -->
                      <i class="bi bi-exclamation-circle"></i>
                    </button>
                    <span *ngSwitchDefault>{{ row[col] }}</span>
                  </ng-container>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="pagination-controls">
            <button (click)="previousPageEditor()" [disabled]="currentPageEditor === 1">Previous</button>
            <span>Page {{ currentPageEditor }} of {{ totalPagesEditor }}</span>
            <button (click)="nextPageEditor()" [disabled]="currentPageEditor === totalPagesEditor">Next</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #NoData>
      <div class="themeClr">
        <h1 class="fs-2 text-center vh-50 p-3 m-4 text-danger "> No Manuscript Found </h1>
      </div>
    </ng-template>

  </div>

</div>

<div class="modal fade" id="assignReviewerModal" tabindex="-1" aria-labelledby="assignReviewerModalLabel"
  aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="assignReviewerModalLabel">Assign Reviewer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="assignReviewer()">
          <div class="mb-3">
            <label class="form-label">Journal </label>
            <input type="text" class="form-control" [(ngModel)]="JournalTitle" name="journalId" readonly />
          </div>

          <div class="mb-3">
            <label for="reviewerDropdown" class="form-label">Select Reviewer:</label>
            <select id="reviewerDropdown" class="form-select" [(ngModel)]="selectedReviewerId" name="reviewerId"
              required>
              <option value="" disabled>Select Reviewer</option>
              <option *ngFor="let reviewer of reviewerList" [value]="reviewer.emailId">
                {{ reviewer.candidateName }}
              </option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success" [disabled]="selectedReviewerId === ''">Assign
              Reviewer</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
